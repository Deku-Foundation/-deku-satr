version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Africa/Algiers
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "05:20"
      timezone: Africa/Algiers
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: wednesday
      time: "05:40"
      timezone: Africa/Algiers
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      google-mlkit:
        patterns:
          - "com.google.mlkit:*"
