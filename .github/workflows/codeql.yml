name: CodeQL security analysis

on:
  push:
    branches: [main, dev]
    paths:
      - "android/**"
      - "src/**"
      - "vite.config.js"
      - "package.json"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "android/**"
      - "src/**"
      - "vite.config.js"
      - "package.json"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "31 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true

      - name: Set up JDK for Android analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK for Kotlin analysis
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: matrix.language == 'java-kotlin'
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build Android target for CodeQL
        if: matrix.language == 'java-kotlin'
        run: gradle --no-daemon -p android assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
